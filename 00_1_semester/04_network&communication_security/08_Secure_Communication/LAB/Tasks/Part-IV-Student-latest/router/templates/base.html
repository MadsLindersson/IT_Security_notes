<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MoSec Educational Router - {{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <aside class="sidebar">
      <h1>MoSec Educational Router</h1>
      <nav>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('interfaces') }}">Interfaces</a>
        <a href="{{ url_for('routing') }}">Routing</a>
        <a href="{{ url_for('nat') }}">NAT</a>
        <a href="{{ url_for('firewall') }}">Firewall / ACL</a>
        <a href="{{ url_for('help_page') }}">Help</a>
      </nav>
      <form method="post" action="{{ url_for('logout') }}">
        <button type="submit" class="secondary">Log out</button>
      </form>
    </aside>
    <main>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="messages">
            {% for category, message in messages %}
              <div class="message {{ category }}">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
